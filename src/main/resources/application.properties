spring.application.name=gmca-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gmca}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

gmca.jwt.secret=${JWT_SECRET:change-this-development-secret-at-least-32-chars}
gmca.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
gmca.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
