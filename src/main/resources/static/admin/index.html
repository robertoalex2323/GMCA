<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMCA - Gerencia</title><link rel="stylesheet" href="/assets/css/app.css"></head>
<body data-roles="ROLE_GERENCIA">
<header><div><strong>GMCA</strong><p class="kicker">Gerencia</p></div><nav data-nav></nav></header>
<main>
  <section class="hero"><div><p class="kicker" data-user></p><h1>Dashboard ejecutivo</h1><p>Indicadores comerciales, deuda, stock y trazabilidad operativa.</p></div><button onclick="loadAdmin()">Actualizar</button></section>
  <section class="card-grid">
    <article class="card"><h3>Productos</h3><div class="metric" id="mProducts">0</div></article>
    <article class="card"><h3>Clientes</h3><div class="metric" id="mClients">0</div></article>
    <article class="card"><h3>Ventas confirmadas</h3><div class="metric" id="mSales">0</div></article>
    <article class="card"><h3>Deuda total</h3><div class="metric" id="mDebt">S/ 0.00</div></article>
  </section>
  <section class="two-col" style="margin-top:16px">
    <article class="card"><h2>Crear producto</h2><form id="productForm"><label>SKU<input name="sku" required></label><label>Nombre<input name="name" required></label><label>Tipo<select name="type"><option value="FINISHED_RICE">Arroz terminado</option><option value="BYPRODUCT">Subproducto</option></select></label><label>Precio base<input name="basePrice" type="number" min="0" step="0.01" required></label><button>Guardar</button><p id="productMsg" class="notice"></p></form></article>
    <article class="card"><h2>Productos</h2><div class="table-shell"><table><thead><tr><th>SKU</th><th>Producto</th><th>Tipo</th><th>Precio</th></tr></thead><tbody id="productsBody"></tbody></table></div></article>
  </section>
  <section class="card" style="margin-top:16px"><h2>Clientes y deuda</h2><div class="table-shell"><table><thead><tr><th>Cliente</th><th>Documento</th><th>Credito</th><th>Deuda</th><th>Estado</th></tr></thead><tbody id="clientsBody"></tbody></table></div></section>
</main>
<script src="/assets/js/app.js"></script>
<script>
async function loadAdmin(){
  const [products, clients, sales] = await Promise.all([api('/api/inventory/products'), api('/api/master/clients'), api('/api/sales')]);
  document.getElementById('mProducts').textContent = products.length;
  document.getElementById('mClients').textContent = clients.length;
  document.getElementById('mSales').textContent = sales.length;
  document.getElementById('mDebt').textContent = fmtMoney(clients.reduce((sum,c)=>sum+Number(c.currentDebt||0),0));
  document.getElementById('productsBody').innerHTML = products.map(p=>`<tr><td>${p.sku}</td><td>${p.name}</td><td>${p.type}</td><td>${fmtMoney(p.basePrice)}</td></tr>`).join('');
  document.getElementById('clientsBody').innerHTML = clients.map(c=>`<tr><td>${c.businessName}</td><td>${c.documentNumber}</td><td>${fmtMoney(c.creditLimit)}</td><td>${fmtMoney(c.currentDebt)}</td><td>${c.active?'<span class="badge ok">Activo</span>':'<span class="badge danger">Inactivo</span>'}</td></tr>`).join('');
}
document.getElementById('productForm').addEventListener('submit',async(e)=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.basePrice=Number(data.basePrice);try{await api('/api/inventory/products',{method:'POST',body:JSON.stringify(data)});setNotice('productMsg','Producto creado','ok');e.target.reset();loadAdmin();}catch(err){setNotice('productMsg',err.message,'error');}});
document.addEventListener('DOMContentLoaded',()=>setTimeout(loadAdmin,0));
</script>
</body></html>
